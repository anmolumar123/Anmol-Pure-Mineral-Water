<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="waterWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#7dd3fc" stroke-width="4" />
  
  <!-- Outer Ring Accent -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  
  <!-- Mountain Peaks Behind Drop -->
  <polygon points="55,130 85,90 115,130" fill="#075985" opacity="0.5" />
  <polygon points="90,130 115,85 145,130" fill="#0c4a6e" opacity="0.5" />
  <polygon points="85,90 92,100 80,100" fill="#f0f9ff" opacity="0.8" />
  <polygon points="115,85 122,96 110,96" fill="#f0f9ff" opacity="0.8" />
  
  <!-- Stylized Pure Water Drop -->
  <path d="M 100 38 C 100 38, 62 88, 62 120 C 62 142 79 160 100 160 C 121 160 138 142 138 120 C 138 88, 100 38 100 38 Z" fill="url(#dropGrad)" />
  
  <!-- Water Drop Highlight Reflection -->
  <path d="M 88 75 C 80 88 74 104 74 120 C 74 128 77 135 80 140 C 76 134 74 126 74 118 C 74 100 82 84 88 75 Z" fill="#ffffff" opacity="0.65" />
  
  <!-- Wave inside drop -->
  <path d="M 72 125 Q 85 115 100 125 T 128 125 C 132 134 128 148 116 154 C 106 158 92 156 82 148 C 76 142 72 134 72 125 Z" fill="url(#waterWave)" />
  
  <!-- Center Star Sparkle -->
  <path d="M 100 105 L 102 112 L 109 114 L 102 116 L 100 123 L 98 116 L 91 114 L 98 112 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Banner Text APMW -->
  <rect x="40" y="152" width="120" height="26" rx="13" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <text x="100" y="169" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#0369a1" text-anchor="middle" letter-spacing="2">ANMOL PURE</text>
</svg>
