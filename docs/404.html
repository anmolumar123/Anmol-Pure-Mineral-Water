<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Anmol Pure Mineral Water</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Re-routes 404s back to index.html with preserved path
      var segmentCount = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        path.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc;">
      <div style="text-align: center; max-width: 400px; padding: 2rem;">
        <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem;">Anmol Pure Mineral Water</h2>
        <p style="font-size: 0.875rem; color: #94a3b8;">Loading application, please wait...</p>
      </div>
    </div>
  </body>
</html>
